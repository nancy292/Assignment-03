<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Platform</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }

        /* Navbar styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
        }

        .nav-item {
            margin-left: 1.5rem;
        }

        .nav-link {
            color: #555;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #007bff;
        }

        /* Search overlay styles */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: flex-start;
            padding-top: 100px;
            z-index: 200;
        }

        .search-container {
            width: 90%;
            max-width: 600px;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .search-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-search {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #555;
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            border: none;
            border-bottom: 1px solid #eee;
            font-size: 1rem;
            outline: none;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .user-item {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-item:hover {
            background-color: #f5f5f5;
        }

        .user-name {
            font-weight: 600;
        }

        .user-username {
            color: #777;
            font-size: 0.9rem;
        }

        .user-email {
            color: #999;
            font-size: 0.8rem;
        }

        /* Content area */
        #content {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
            }

            .navbar-brand {
                font-size: 1.2rem;
            }

            .nav-item {
                margin-left: 1rem;
            }

            .search-overlay {
                padding-top: 70px;
            }
        }

        @media (max-width: 576px) {
            .navbar {
                flex-direction: column;
                padding: 1rem 0.5rem;
            }

            .navbar-nav {
                margin-top: 1rem;
                width: 100%;
                justify-content: space-around;
            }

            .nav-item {
                margin-left: 0;
            }
        }
    </style>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background-color: #4a6cf7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #3a5ce5;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background-color: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 20px;
            display: none;
        }

        /* Button to open the modal */
        .open-modal-btn {
            margin: 20px;
        }
    </style>
</head>

<body style="background-color: #f1f5f9;">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">InstaClone</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a href="/" class="nav-link">Timeline</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="search-link">Search</a>
            </li>
            <li class="nav-item">
                <a href="/userprofile" class="nav-link">Profile</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="sign-out">Sign Out</a>
            </li>
        </ul>
    </nav>

    <!-- Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-container">
            <div class="search-header">
                <div class="search-title">Search Users</div>
                <button class="close-search" id="close-search">&times;</button>
            </div>
            <input type="text" class="search-input" id="search-input" placeholder="Search by name or username...">
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <div id="content">
        {% block content %}{% endblock %}

    </div>

    <div class=" modal-overlay" id="modalOverlay" style="display: none; z-index: 100;">
        <div class="modal">
            <div class="modal-header">
                <h2>Profile Information</h2>
            </div>
            <form id="profileForm">
                <div class="form-group">
                    <label for="profileName">Profile Name</label>
                    <input type="text" id="profileName" name="profileName" required>
                    <div class="error-message" id="nameError">Please enter a profile name</div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                    <div class="error-message" id="usernameError">Please enter a username</div>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" required></textarea>
                    <div class="error-message" id="bioError">Please enter your bio</div>
                </div>

                <p class="registration-error" style="display: none; color:#e74c3c; margin-bottom: 5px;"
                    id="registration-error">Error:</p>
                <button type="submit">Submit</button>

                <div class="success-message" id="successMessage">
                    Profile information submitted successfully!
                </div>
            </form>
        </div>
    </div>
    <script>
        var users
        var userEmailInIndex
        var userDetailsInIndex
        const getAllUsersData = async () => {
            try {

                const allUsersResp = await fetch("/getusersfromAPI")
                const allUsersJSON = await allUsersResp.json()
                const allUsers = allUsersJSON.users
                console.log("all users ", allUsers)
                users = allUsers
            }
            catch (Error) {
                cosnole.log("Error is ", Error)
            }
        }


        const searchLink = document.getElementById('search-link');
        const searchOverlay = document.getElementById('search-overlay');
        const closeSearch = document.getElementById('close-search');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const signoutLink = document.getElementById('sign-out');

        searchLink.addEventListener('click', () => {
            searchOverlay.style.display = 'flex';
            searchInput.focus();
        });

        closeSearch.addEventListener('click', () => {
            searchOverlay.style.display = 'none';
            searchInput.value = '';
            searchResults.innerHTML = '';
        });

        searchOverlay.addEventListener('click', (e) => {
            if (e.target === searchOverlay) {
                searchOverlay.style.display = 'none';
                searchInput.value = '';
                searchResults.innerHTML = '';
            }
        });

        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.toLowerCase();
            console.log("search term ", searchTerm)
            searchResults.innerHTML = '';

            if (searchTerm.trim() === '') return;
            console.log("users ", users)
            const filteredUsers = users?.filter(user =>

                user?.full_name?.toLowerCase()?.includes(searchTerm)
            );

            filteredUsers?.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                userItem.innerHTML = `
                    <div class="user-name">${user.full_name}</div>
                    <div class="user-username">@${user.Username}</div>
                    <div class="user-email">${user.useremail}</div>
                `;

                userItem.addEventListener('click', () => {
                    window.location.href = `/user/${user.Username}`;
                });

                searchResults.appendChild(userItem);
            });

            if (filteredUsers?.length === 0) {
                searchResults.innerHTML = '<div class="user-item">No users found</div>';
            }
        });



        function parseJWT(jwtToken) {
            try {
                const base64Payload = jwtToken.split('.')[1];
                return JSON.parse(atob(base64Payload));
            } catch (err) {
                return {};
            }
        }

        function validateForm() {
            const isUsernameValid = usernameInput.value.trim() !== '';
            const isPasswordValid = passwordInput.value.trim() !== '';

            loginButton.disabled = !(isUsernameValid && isPasswordValid);
            signinButton.disabled = !(isUsernameValid && isPasswordValid);
        }


        function extractTokenFromCookies(cookies) {
            return cookies
                .split(';')
                .map(cookie => cookie.trim().split('='))
                .find(([key]) => key === 'token')?.[1] || "";
        }

        function checkUserExist() {
            console.log("email in function ", userEmailInIndex)
            fetch("/createnewuser", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ email: userEmailInIndex })
            })
        }

        async function getUserDetails() {
            const userDetailsRes = await fetch("/getUser", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ Username: userEmailInIndex })
            })
            const userD = await userDetailsRes.json();
            userDetailsInIndex = userD.user
        }

        async function checkUsername() {
            if (userDetailsInIndex) {
                console.log("userDetailsInIndex ", userDetailsInIndex)
                if (userDetailsInIndex.Username == '') {
                    openModal()
                }
            }
        }

        async function verifyUserSession() {

            const authToken = extractTokenFromCookies(document.cookie);
            if (!authToken) {
                window.location.href = "/";
                return;
            }
            userEmailInIndex = parseJWT(authToken).email || "User";
            console.log("user email in index ", userEmailInIndex)
            await checkUserExist();
            await getUserDetails();
            await checkUsername()

        }
        document.addEventListener('DOMContentLoaded', function () {
            getAllUsersData()
            verifyUserSession()
        })


        function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('profileForm').reset();
            document.getElementById('successMessage').style.display = ' none';

            const errorMessages = document.querySelectorAll('.error-message');
            errorMessages.forEach(msg => {
                msg.style.display = 'none';
            });

        }

        document.getElementById('modalOverlay').addEventListener('click', function (event) {
            if (event.target === this) {
                closeModal();
            }
        });

        document.getElementById('profileForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const profileName = document.getElementById('profileName').value.trim();
            const username = document.getElementById('username').value.trim();
            const bio = document.getElementById('bio').value.trim();

            let isValid = true;

            if (!profileName) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('nameError').style.display = 'none';
            }

            if (!username) {
                document.getElementById('usernameError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('usernameError').style.display = 'none';
            }

            if (!bio) {
                document.getElementById('bioError').style.display = 'block';
                isValid = false;
            } else {
                document.getElementById('bioError').style.display = 'none';
            }

            if (isValid) {
                const profileData = {
                    profileName,
                    username,
                    bio
                };

                sendDataToAPI(profileData);
            }
        });

        function sendDataToAPI(data) {
            const submitButton = document.querySelector('#profileForm button[type="submit"]');
            const originalButtonText = submitButton.textContent;
            submitButton.textContent = 'Submitting...';
            submitButton.disabled = true;
            data['email'] = userEmailInIndex;
            console.log("data ", data)
            try {

                fetch('/modifyusername', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {

                        document.getElementById('successMessage').style.display = 'block';

                        setTimeout(() => {
                            closeModal();
                            window.location.reload();
                        }, 2000);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        document.getElementById('registration-error').style.display = "flex"
                        document.getElementById('registration-error').textContent = "Error: Username already exist please enter other username."

                    })
                    .finally(() => {
                        submitButton.textContent = originalButtonText;
                        submitButton.disabled = false;
                    });

            }
            catch (error) {
                document.getElementById('registration-error').style.display = "flex"

                document.getElementById('registration-error').textContent = "Error: Username already exist please enter other username."
            }

        }
    </script>
    <script type="module" src="{{ url_for('static', path='/firebase-login.js') }}"></script>
    <script>

    </script>
</body>

</html>
